      <stop offset="0%" stop-color="#121713" />
      <stop offset="100%" stop-color="#080A09" />
    </radialGradient>
    <linearGradient id="contourGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B5E48C" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#52796F" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#203D2A" stop-opacity="0.1" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  
  <!-- Subtle Topographic Contour Lines -->
  <g fill="none" stroke="url(#contourGrad)" stroke-width="1.2">
    <path d="M-100,360 Q200,180 500,340 T1100,280 T1400,380" opacity="0.6"/>
    <path d="M-100,390 Q220,220 520,380 T1120,320 T1400,420" opacity="0.5"/>
