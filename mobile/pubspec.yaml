name: aura_flora
description: AuraFlora — BioAcoustic Grounding Companion. Anti-screen mobile app for the Hacktoberfest 2026 Touch Grass Challenge.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Audio Recording — microphone capture
  record: ^5.1.0

  # Audio Playback — MP3 streaming
  audioplayers: ^6.0.0

  # State Management
  flutter_riverpod: ^2.5.1

  # HTTP Client
  dio: ^5.4.3

  # Screen Wakelock (keep display on during blackout)
  wakelock_plus: ^1.2.0

  # Google Fonts — Inter typography
  google_fonts: ^6.2.1

  # File path utilities
  path_provider: ^2.1.3

  # Permission handling
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
