# AuraFlora — Render Web Services Configuration
# https://render.com/docs/render-yaml-spec

services:
  - type: web
    name: aura-flora-backend
    runtime: rust
    region: oregon
    plan: starter

    buildCommand: cd backend && cargo build --release
    startCommand: ./backend/target/release/aura-flora-backend

    healthCheckPath: /health

    envVars:
      - key: RUST_LOG
        value: info
      - key: PORT
        value: 8080
      - key: AUDIO_TEMP_DIR
        value: /tmp/aura-flora-audio
      - key: GEMMA_API_KEY
        sync: false
      - key: GEMMA_MODEL
        value: gemma-2b-it
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: TABPFN_API_KEY
        sync: false
      - key: TABPFN_ENDPOINT
        value: https://api.priorlabs.ai/v1/tabpfn
